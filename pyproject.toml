[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpubridge"
version = "0.3.0a0"
description = "Run one PyTorch training job across NVIDIA and AMD GPUs at once: native NCCL/RCCL per vendor, joined by a CPU bridge."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["pytorch", "distributed", "nccl", "rccl", "cuda", "rocm", "gpu", "multi-vendor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    # On GPU nodes, install the CUDA or ROCm build of torch first; pip and uv
    # leave an existing install alone as long as it meets this floor. Before
    # 2.8, tearing down a Gloo group could deadlock (see gpubridge.destroy();
    # fixed upstream by https://github.com/pytorch/pytorch/pull/154976).
    "torch>=2.8",
    # torch.distributed.all_gather_object, used for discovery, needs numpy,
    # which torch does not install.
    "numpy",
]

[project.urls]
Homepage = "https://github.com/DavidCzartoryski/gpubridge"
Changelog = "https://github.com/DavidCzartoryski/gpubridge/blob/main/CHANGELOG.md"
Issues = "https://github.com/DavidCzartoryski/gpubridge/issues"
"Hardware validation" = "https://github.com/DavidCzartoryski/gpubridge/blob/main/HARDWARE_VALIDATION.md"

[project.optional-dependencies]
test = ["pytest>=8"]

# init_process_group(backend="gpubridge") without import gpubridge. Newer torch
# loads this group only when the backend name is first asked for:
[project.entry-points."torch.distributed.backends"]
gpubridge = "gpubridge.torch_backend:register"
# Older torch (2.8 included) has only this one, which it calls on every import of
# torch: src/gpubridge_backend.py catches every exception (TORCH_DEVICE_BACKEND_AUTOLOAD=0
# turns it off).
[project.entry-points."torch.backends"]
gpubridge = "gpubridge_backend:register"

[tool.hatch.build.targets.wheel]
packages = ["src/gpubridge"]

[tool.hatch.build.targets.wheel.force-include]
"src/gpubridge_backend.py" = "gpubridge_backend.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA or ROCm GPU; skipped without one (pytest -m gpu on a GPU node)"]
