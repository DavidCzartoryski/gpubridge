[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpubridge"
version = "0.2.0a0"
description = "Run one PyTorch training job across NVIDIA and AMD GPUs at once: native NCCL/RCCL per vendor, joined by a CPU bridge."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # On GPU nodes, install the CUDA or ROCm build of torch first; pip and uv
    # leave an existing install alone as long as it meets this floor. Before
    # 2.8, tearing down a Gloo group could deadlock (see gpubridge.destroy();
    # fixed upstream by https://github.com/pytorch/pytorch/pull/154976).
    "torch>=2.8",
    # torch.distributed.all_gather_object, used for discovery, needs numpy,
    # which torch does not install.
    "numpy",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/gpubridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
