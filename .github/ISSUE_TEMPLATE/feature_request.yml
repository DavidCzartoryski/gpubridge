name: Feature request
description: Suggest a change or a new feature.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do with mixed NVIDIA and AMD GPUs, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: The behavior or API you have in mind, and any alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware and scale
      description: GPUs, interconnect and job size, if the request depends on them.
