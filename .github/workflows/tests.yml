name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # main's ruleset requires the checks "pytest (3.10)" and "pytest (3.12)".
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported torch on the oldest Python, and the newest on 3.12.
        # The fake-cluster job tests (tests/test_gpu_jobs.py, ~5 min) check the GPU
        # kit's shell scripts, not torch, so only the 3.12 job runs them.
        include:
          - {python-version: "3.10", torch: "torch==2.8.0",
             pytest-args: "--ignore=tests/test_gpu_jobs.py"}
          - {python-version: "3.12", torch: "torch", pytest-args: ""}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # setup-uv publishes no moving major tags since v8
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      # CPU wheels keep the job small; the tests run in simulation mode.
      - run: uv pip install "${{ matrix.torch }}" --index-url https://download.pytorch.org/whl/cpu
      - run: python -c "import torch; print(torch.__version__)"
      - run: uv pip install -e ".[test]"
      # Bridge compression's Triton kernels run in Triton's CPU interpreter here
      # (tests/test_compression_kernels.py). Not a test extra: on an AMD GPU node,
      # PyPI's triton would shadow the ROCm build's own.
      - run: uv pip install triton
      # shellcheck ships with ubuntu-latest; the kit's tests also run it when present.
      - run: shellcheck scripts/*.sh scripts/gpu/*.sh scripts/gpu/*/*.sh scripts/gpu/explorer/*.sbatch tests/fake_cluster/*
      - run: pytest ${{ matrix.pytest-args }}
        env:
          GPUBRIDGE_REQUIRE_TRITON: "1"  # the kernel tests fail instead of skipping
      - run: python examples/simulate_two_islands.py

  ucx:
    # The UCX bridge transport (docs/RDMA_TRANSPORT.md): built against Ubuntu's
    # UCX and tested between processes over UCX's TCP transport. Not a required
    # check; the pytest jobs above skip these tests (no UCX there).
    name: ucx bridge (3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The runners expose an RDMA device UCX finds but can't use (ibv_create_srq
      # fails), so its default transport choice can't initialize there.
      UCX_TLS: tcp,self
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          activate-environment: true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libucx-dev ucx-utils
      - run: ucx_info -v
      - run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install -e ".[test]"
      - run: python -m gpubridge.ucx build && python -m gpubridge.ucx info
      - run: pytest tests/test_ucx.py -rs
