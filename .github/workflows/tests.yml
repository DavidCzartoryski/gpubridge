name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    # Whether this run needs the heavy jobs: every push to main does; a pull request
    # does unless every file it changes is documentation. The heavy jobs skip with a
    # job-level `if:` (a skipped job counts as passing), never with workflow-level
    # paths-ignore, which would leave required checks unreported.
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # a pull request checks out its merge commit: HEAD^1 is the base
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "a $EVENT: every job runs"
            echo "code=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Documentation: Markdown anywhere, docs/ (text and images), the license and
          # the issue templates. Anything else, notebooks and workflows included, is code.
          # (An assignment, so that a failing git diff fails the job under bash -e.)
          files=$(git diff --name-only --no-renames HEAD^1 HEAD)
          code=false
          while IFS= read -r path; do
            case $path in
            "") ;;
            *.md | docs/* | LICENSE | .github/ISSUE_TEMPLATE/*) echo "docs: $path" ;;
            *) echo "code: $path"; code=true ;;
            esac
          done <<<"$files"
          echo "code=$code" >>"$GITHUB_OUTPUT"

  docs:
    # Always runs, in about a minute: the tests that read committed docs or notebooks
    # (pytest -m docs), shellcheck and ruff.
    name: docs and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # setup-uv publishes no moving major tags since v8
        with:
          python-version: "3.12"
          activate-environment: true
      # pytest collects every test file before -m picks the docs tests, so this needs
      # what the files import: torch (the CPU wheel, from setup-uv's cache) and triton.
      - run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install -e ".[test]" triton
      - run: pytest -m docs -rA
      # shellcheck ships with ubuntu-latest; the kit's tests also run it when present.
      - run: shellcheck scripts/*.sh scripts/gpu/*.sh scripts/gpu/*/*.sh scripts/gpu/explorer/*.sbatch tests/fake_cluster/*
      # Ruff's classic rules (pyflakes, and pycodestyle's import and statement checks),
      # with no config file. The Kaggle notebook is generated by make_notebook.py.
      - run: uvx ruff@0.17.0 check --isolated --select E4,E7,E9,F --extend-exclude "*.ipynb" .

  tests-310:
    # The oldest supported torch on the oldest Python, in 3 jobs that each run every
    # third test (GPUBRIDGE_TEST_SHARD, tests/conftest.py), one test at a time as on a
    # developer's machine: many tests start 2 to 4 processes and some time things, so
    # they don't share a runner's CPUs with each other. The fake-cluster job tests
    # (tests/test_gpu_jobs.py) check the GPU kit's shell scripts, not torch, so only
    # the 3.12 jobs run them.
    name: pytest 3.10 (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.10"
          activate-environment: true
      # CPU wheels keep the job small; the tests run in simulation mode.
      - run: uv pip install "torch==2.8.0" --index-url https://download.pytorch.org/whl/cpu
      - run: python -c "import os, torch; print(torch.__version__, os.cpu_count(), 'CPUs')"
      - run: uv pip install -e ".[test]"
      # Bridge compression's Triton kernels run in Triton's CPU interpreter here
      # (tests/test_compression_kernels.py). Not a test extra: on an AMD GPU node,
      # PyPI's triton would shadow the ROCm build's own.
      - run: uv pip install triton
      - run: pytest --durations=25 --ignore=tests/test_gpu_jobs.py
        env:
          GPUBRIDGE_TEST_SHARD: ${{ matrix.shard }}/3
          GPUBRIDGE_REQUIRE_TRITON: "1"  # the kernel tests fail instead of skipping
      - if: matrix.shard == 1
        run: python examples/simulate_two_islands.py

  tests-312:
    # The newest torch on 3.12, fake-cluster tests included, in 4 jobs.
    name: pytest 3.12 (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          activate-environment: true
      - run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -c "import os, torch; print(torch.__version__, os.cpu_count(), 'CPUs')"
      - run: uv pip install -e ".[test]"
      - run: uv pip install triton
      - run: pytest --durations=25
        env:
          GPUBRIDGE_TEST_SHARD: ${{ matrix.shard }}/4
          GPUBRIDGE_REQUIRE_TRITON: "1"
      - if: matrix.shard == 1
        run: python examples/simulate_two_islands.py

  pytest-310:
    # main's ruleset requires "pytest (3.10)" and "pytest (3.12)"; these two keep
    # reporting them, so the ruleset can switch to ci-ok (below) at any time. Each
    # passes only if docs and lint passed and its shards all passed, or all skipped
    # on a docs-only change. A plain `needs` won't do: a job whose needs failed is
    # skipped, and a skipped required check counts as passing.
    name: pytest (3.10)
    needs: [changes, docs, tests-310]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          DOCS: ${{ needs.docs.result }}
          TESTS: ${{ needs.tests-310.result }}
        run: |
          echo "changes: $CHANGES (code: $CODE), docs and lint: $DOCS, shards: $TESTS"
          [ "$CHANGES" = success ] || { echo "::error::changes: $CHANGES"; exit 1; }
          [ "$DOCS" = success ] || { echo "::error::docs and lint: $DOCS"; exit 1; }
          [ "$TESTS" = success ] || { [ "$TESTS" = skipped ] && [ "$CODE" = false ]; } ||
            { echo "::error::shards: $TESTS on a change with code: $CODE"; exit 1; }

  pytest-312:
    name: pytest (3.12)
    needs: [changes, docs, tests-312]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          DOCS: ${{ needs.docs.result }}
          TESTS: ${{ needs.tests-312.result }}
        run: |
          echo "changes: $CHANGES (code: $CODE), docs and lint: $DOCS, shards: $TESTS"
          [ "$CHANGES" = success ] || { echo "::error::changes: $CHANGES"; exit 1; }
          [ "$DOCS" = success ] || { echo "::error::docs and lint: $DOCS"; exit 1; }
          [ "$TESTS" = success ] || { [ "$TESTS" = skipped ] && [ "$CODE" = false ]; } ||
            { echo "::error::shards: $TESTS on a change with code: $CODE"; exit 1; }

  ucx:
    # The UCX bridge transport (docs/RDMA_TRANSPORT.md): built against Ubuntu's
    # UCX and tested between processes over UCX's TCP transport. The pytest jobs
    # above skip these tests (no UCX there).
    name: ucx bridge (3.12)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The runners expose an RDMA device UCX finds but can't use (ibv_create_srq
      # fails), so its default transport choice can't initialize there.
      UCX_TLS: tcp,self
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          activate-environment: true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libucx-dev ucx-utils
      - run: ucx_info -v
      - run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install -e ".[test]"
      - run: python -m gpubridge.ucx build && python -m gpubridge.ucx info
      - run: pytest tests/test_ucx.py -rs

  multitcp:
    # The multitcp bridge transport (docs/RUST_TRANSPORT.md): its Rust crate formatted,
    # linted and unit-tested, then built through Python and tested between processes
    # over loopback TCP. The pytest jobs above also run tests/test_multitcp.py where
    # cargo is installed, as it is on GitHub's Ubuntu runners.
    name: multitcp bridge (3.12)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          activate-environment: true
      - run: rustup component add rustfmt clippy && cargo --version
      - working-directory: src/gpubridge/multitcp/crate
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install -e ".[test]"
      - run: python -m gpubridge.multitcp build && python -m gpubridge.multitcp info
      - run: pytest tests/test_multitcp.py -rs

  ci-ok:
    # The one check for main's ruleset to require: it passes only if every job above
    # succeeded or was skipped, and fails if any failed or was cancelled. `if:
    # always()` makes it report even then. Skipped counts only when changes found a
    # docs-only change: only the heavy jobs skip, and only then.
    name: ci-ok
    needs: [changes, docs, tests-310, tests-312, pytest-310, pytest-312, ucx, multitcp]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "code: $CODE"
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r --arg code "$CODE" '[to_entries[] | select(
                .value.result != "success" and (.value.result != "skipped" or $code != "false"))
                | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::not successful: $bad"
            exit 1
          fi
