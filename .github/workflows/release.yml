name: release

# For a version tag (v0.3.0-alpha, ...): check the tag matches the package
# version, build the sdist and wheel, and check them with twine. Pull requests
# and manual runs do the same build and check (without the tag check), so this
# workflow is tested before any tag; only a tag push can reach the publish job.
# Publishing to PyPI uses trusted publishing (no token stored here) and stays
# off until the repository variable PUBLISH_TO_PYPI is "true", so pushing a tag
# never publishes by accident. CHANGELOG.md says what each release contains.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # setup-uv publishes no moving major tags since v8
        with:
          python-version: "3.12"
      - if: github.ref_type == 'tag'
        run: python scripts/check_release_tag.py "$GITHUB_REF_NAME"
      - run: uv build
      - run: uvx twine check --strict dist/*
      # The wheel, installed on its own: importing torch leaves gpubridge alone, and its
      # lazy entry point registers backend="gpubridge" when the name is first asked for
      # (torch 2.14+; editable installs in the test jobs never use the wheel).
      - run: |
          uv venv /tmp/wheelcheck
          uv pip install --python /tmp/wheelcheck torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python /tmp/wheelcheck dist/*.whl
          /tmp/wheelcheck/bin/python -c "import sys, torch, torch.distributed as dist; assert 'gpubridge' not in dist.Backend.backend_list; assert not any(m.split('.')[0] == 'gpubridge' for m in sys.modules); assert dist.is_backend_available('gpubridge'); import gpubridge; print('wheel ok')"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: >-
      github.event_name == 'push' && github.ref_type == 'tag' &&
      vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The PyPI trusted publisher names this workflow file and this environment.
    environment:
      name: pypi
      url: https://pypi.org/project/gpubridge/
    permissions:
      id-token: write  # trusted publishing: PyPI accepts this job's OIDC token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
